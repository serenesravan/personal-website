<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mobility | Sravan Bagalkote</title>
    <link rel="canonical" href="https://sravanbagalkote.in/">
    <script>
      const destination = new URL("../", window.location.href);
      const anchor = window.location.hash.slice(1);
      destination.search = window.location.search;
      destination.hash = anchor && anchor !== "today" ? `mobility/${anchor}` : "mobility";
      window.location.replace(destination);
    </script>
  </head>
  <body>
    <p><a href="../#mobility">Open Mobility</a></p>
  </body>
